[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-retrieval"
version = "0.1.0"
description = "Vietnamese legal document retrieval project scaffold"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["PyYAML==6.0.3", "pyarrow==26.0.0"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
