dataset:
  id: th1nhng0/vietnamese-legal-documents
  revision: 8977887f17be2defae4c5171d55562e1cde7d695 # Đã xác minh qua API Hub tại SHA này.
  configs: [metadata, content, relationships] # Chỉ audit ba bảng hiện hành, không lấy legacy.
  license_status: claimed_source_rights_unresolved
  claimed_license: cc-by-4.0
  source_rights: unverified # Nguồn ghi trong card chưa chứng minh quyền sử dụng dữ liệu gốc.
paths:
  raw: data/raw
  interim: data/interim
  processed: data/processed
  annotations: data/annotations
  manifests: data/manifests
schema:
  id_field: id # ID của metadata và content hiện hành là chuỗi.
  text_field: content_html # Giữ nguyên HTML gốc, chỉ đọc để kiểm định.
  metadata_fields:
    - title
    - so_ky_hieu
    - ngay_ban_hanh
    - loai_van_ban
    - ngay_co_hieu_luc
    - ngay_het_hieu_luc
    - nguon_thu_thap
    - ngay_dang_cong_bao
    - nganh
    - linh_vuc
    - co_quan_ban_hanh
    - chuc_danh
    - nguoi_ky
    - pham_vi
    - thong_tin_ap_dung
    - tinh_trang_hieu_luc
  tables:
    metadata: {split: data, id_field: id, text_field: null}
    content: {split: data, id_field: id, text_field: content_html}
    relationships: {split: data, id_field: doc_id, target_field: other_doc_id}
cleaning:
  status: proposed_not_implemented
  unicode_normalization: NFC
  preserve_raw: true
chunking:
  status: proposed_not_implemented
  strategy: null # Chỉ chốt sau khi kiểm tra cấu trúc và giới hạn tokenizer thật.
  max_tokens: null
  overlap_tokens: null
seed: 42
output_format: jsonl # Định dạng dự kiến; chưa tạo dữ liệu processed.
